name: Update PK Architecture timetable

on:
  push:
    branches: [main]
    paths:
      - "update_calendar.py"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pk-architecture-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and extract official timetable
        run: python update_calendar.py

      - name: Commit source changes
        run: |
          git config user.name "pk-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add source-state.json latest_schedule.txt latest_tables.json
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "Update official PK timetable source"
            git push
          fi
